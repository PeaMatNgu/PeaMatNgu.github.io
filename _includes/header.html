<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Trang chủ {{ site.title }}">
      <span class="brand-mark" aria-hidden="true">CT</span>
      <span>{{ site.title }}</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">Mở menu</span>
      <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Điều hướng chính">
      <a href="{{ '/ctf/' | relative_url }}"{% if page.url contains '/ctf/' %} aria-current="page"{% endif %}>CTF</a>
      <a href="{{ '/htb/' | relative_url }}"{% if page.url contains '/htb/' %} aria-current="page"{% endif %}>HTB</a>
      <a href="{{ '/binary-exploitation/' | relative_url }}"{% if page.url contains '/binary-exploitation/' %} aria-current="page"{% endif %}>Binary</a>
      <a href="{{ '/achievements/' | relative_url }}"{% if page.url contains '/achievements/' %} aria-current="page"{% endif %}>Thành tích</a>
    </nav>
  </div>
</header>
