title: "Cao Trần Thành Trung"
description: "A personal cybersecurity portfolio covering CTFs, Hack The Box, Binary Exploitation, and Learning Notes."
url: "https://peamatngu.github.io"
baseurl: ""
lang: "en"
timezone: "Asia/Bangkok"

author:
  name: "Cao Trần Thành Trung"
  role: "Cybersecurity Student | CTF Player"
  email: "thanhtrungcaotran@gmail.com"
  github: "https://github.com/PeaMatNgu"
  linkedin: ""
  cv: ""
  avatar: "/assets/images/profile-placeholder.svg"
  bio: "Documenting my cybersecurity journey through CTFs, hands-on labs, and Binary Exploitation research."

collections:
  ctf:
    output: true
    permalink: /ctf/:name/
  htb:
    output: true
    permalink: /htb/:name/
  binary:
    output: true
    permalink: /binary-exploitation/:name/
  web:
    output: true
    permalink: /web-security/:name/

defaults:
  - scope:
      path: ""
      type: ctf
    values:
      layout: article
      category_name: "CTF Write-ups"
      category_url: "/ctf/"
  - scope:
      path: ""
      type: htb
    values:
      layout: article
      category_name: "HackTheBox Machine Labs"
      category_url: "/htb/"
  - scope:
      path: ""
      type: binary
    values:
      layout: article
      category_name: "Binary Exploitation"
      category_url: "/binary-exploitation/"
  - scope:
      path: ""
      type: web
    values:
      layout: article
      category_name: "Learning Notes"
      category_url: "/web-security/"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - scripts
