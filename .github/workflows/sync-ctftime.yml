name: Sync CTFtime achievements

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch CTFtime results
        run: python scripts/sync_ctftime.py

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- _data/ctftime.json; then
            echo "CTFtime data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/ctftime.json
          git commit -m "Update CTFtime achievements"
          git push
